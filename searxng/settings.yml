# Настройки инстанса поиска: политика движков и JSON-формат.
#
# **Зачем свой инстанс.** Политику движков задаём мы, а не чужой стек: набор зафиксирован здесь, и он же
# монтируется в контейнер одним файлом — том, оставшийся от прежнего запуска, политику не подменит.
#
# **Набор движков выбран ПО ЗАМЕРУ.** На живой пробе этого инстанса результаты давали только
# `google cse` (19–20 штук) и `bing` (7–10); `wikipedia` оставлена как дешёвый источник без блокировок и
# CAPTCHA. Остальные не подключаются вовсе — тогда `unresponsive_engines` пуст, и «поиск не ответил»
# перестаёт быть нормой.

use_default_settings:
  engines:
    keep_only:
      - "google cse"
      - "bing"
      - "wikipedia"

general:
  instance_name: "Agenta search"
  contact_url: false
  donation_url: false
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  # Только JSON: HTML-интерфейс нам не нужен, а `format=json` — то, чем пользуется обёртка и чем
  # проверяется инстанс (`curl … /search?q=…&format=json`).
  formats:
    - json

server:
  # Значение перекрывается переменной окружения `SEARXNG_SECRET`: `server.secret_key` объявлено в
  # SearXNG как `SettingsValue(environ_name='SEARXNG_SECRET')`, поэтому настоящий секрет задаётся в
  # `.env` и в git не попадает. Здесь оставлен шаблонный `ultrasecretkey` — он же напоминание, что
  # секрет ОБЯЗАН быть задан: при нём SearXNG ругается в журнал, но продолжает работать.
  secret_key: "ultrasecretkey"
  bind_address: "0.0.0.0"
  port: 8080
  base_url: "http://localhost:8090/"
  image_proxy: false
  # Инстанс НЕ публичный: порт открыт только на loopback (см. compose), поэтому клиентский лимитер
  # выключен осознанно — он резал бы наши же запросы, не защищая ни от кого. От внешних обращений
  # защищает привязка к `127.0.0.1`, а не лимитер.
  limiter: false
  public_instance: false

ui:
  static_use_hash: true

outgoing:
  # Мёртвый движок не должен держать запрос: 3 с — дефолт, 4 с — запас на медленный, но живой ответ.
  request_timeout: 4.0
  # Потолок на весь запрос: даже при нескольких медленных движках ответ обязан вернуться быстро.
  max_request_timeout: 6.0

engines:
  # Снять `disabled` у `bing`: в дефолтах SearXNG он ВЫКЛЮЧЕН, а в замере именно он даёт 7–10
  # результатов. Без этой строки `keep_only` оставил бы его в списке, но движок бы не работал —
  # то есть выдача молча обеднела бы.
  - name: bing
    disabled: false
