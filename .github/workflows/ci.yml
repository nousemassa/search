name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Композ разбирается
        env:
          PLATFORM_NETWORK: ci-network
          SEARXNG_SECRET: ci-secret
        run: >
          docker compose --env-file .env.example -f compose.search.yaml config -q
      - name: Лончер синтаксически цел
        run: bash -n search-up.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Настройки инстанса корректны
        run: |
          python -m pip install --quiet pyyaml
          python -c "
          import yaml
          d = yaml.safe_load(open('searxng/settings.yml', encoding='utf-8'))
          keep = d['use_default_settings']['engines']['keep_only']
          assert keep == ['google cse', 'bing', 'wikipedia'], keep
          "
